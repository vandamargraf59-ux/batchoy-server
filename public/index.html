<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3A1209">
<title>Order Online</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <img src="logo.png" alt="" class="logo">
    <div class="tt"><b id="sName">Batchoyan de Lapaz</b><span id="sSub">Order online</span></div>
    <span id="sPill" class="pill">...</span>
    <button id="basketBtn" class="basket hidden" aria-label="Open my order"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1.2 11a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><em id="basketN">0</em></button>
  </header>
  <div id="banner" class="banner hidden"></div>
  <button id="trackBar" class="trackbar hidden"></button>
  <div id="chips" class="chips"></div>
  <main id="list" class="list"><div class="loading">Loading menu...</div></main>
  <button id="cartBar" class="cartbar hidden"></button>
</div>
<div id="sheetBack" class="sheet-back hidden"><div id="sheet" class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast"></div>
<noscript><p style="padding:20px">Please enable JavaScript to order online.</p></noscript>
<script src="app.js"></script>
</body>
</html>
